<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
  name="description"
  content="trdubot的网络索引.
            zhihu: https://www.zhihu.com/people/qu-ge-sha-ming-hao-ni-30,
            blog: https://blog.trudbot.cn,
            github: https://github.com/trudbot"
  >
  <link rel="icon" type="image/png" sizes="32x32" href="https://trudbot-md-img.oss-cn-shanghai.aliyuncs.com/202407082112768.jpg">
  <title>trudbot here!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-size: 14px;
    }

    html {
      font-size: 100px;
      padding: .64rem .16rem .32rem;
      background-color: #3E3B47;
    }

    .content {
      width: min(580px, 100%);
    }

    .link-item {
      margin-bottom: 16px;
    }

    body {
      display: flex;
      align-items: center;
      flex-direction: column;
    }

    .info-container {
      display: flex;
      align-items: center;
      flex-direction: column;
    }

    .links-container {
      margin-top: 32px;
    }

    .avatar {
      --size: 160px;
      display: block;
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      margin-bottom: 16px;
    }

    .name {
      color: #fff;
      font-size: .2rem;
      font-weight: 600;
    }

    .link-text {
      font-size: 16px;
      font-weight: 500;
    }

    .beian {
      margin-top: 10vh;
      bottom: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 12px;
      color: #999;
      text-align: center;
      background: transparent;
    }

    .beian img {
      width: 20px;
      height: 20px;
      margin: 0 5px;
    }

    .beian a {
      border-bottom: 1px solid #999;
      color: #eee;
      outline: 0;
      text-decoration: none;
      overflow-wrap: break-word;
      word-wrap: break-word;
      cursor: pointer;
    }

    #busuanzi_container_site_pv {
      margin-top: 10px;
      color: #fff;
      font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
    }

    .tip {
      color: #aaa;
    }
  </style>
  <script type="module" src="components/LinkButton/index.js"></script>
</head>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-KVFZYET0GD"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-KVFZYET0GD');
</script>

<body>
  <template id="link-button-tpl">
    <style>
      * {
        padding: 0;
        margin: 0;
      }
      a,a:link,a:visited,a:hover,a:active{
        text-decoration: none;
        color:inherit;
      }
      .link-button-wrapper {
        padding: .16rem .66rem;
        transition: transform 0.15s cubic-bezier(0, 0.2, 0.5, 3) 0s;
        box-shadow: rgba(10, 11, 13, 0.08) 0px 2px 4px 0px;
        border-radius: 4px;
        background-color: rgba(255, 255, 255);
        position: relative;
        min-height: .64rem;
        display: flex;
        align-items: center;
        box-sizing: border-box;
      }
      
      .link-content {
        width: 100%;
        height: 100%;
      }
      
      .link-icon {
        overflow: hidden;
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        pointer-events: none;
        left: 8px;
        border-radius: 4px;
        width: 48px;
        height: 48px;
        background-size: cover;
        background-position: center;
      }
      
      .link-text {
        width: 100%;
        font-size: 16px;
        font-weight: 500;
        line-height: 1.5;
        color: black;
        text-align: center;
      }
      
      @media (hover:hover){
        .link-button-wrapper:hover {
          transform: scale(1.02);
        }
      }
    </style>
    
    <a class="link-button-wrapper" target="_blank">
      <div class="link-content">
        <div class="link-icon">
        </div>
        <p class="link-text">
          <slot name="link-text">未填入文本</slot>
        </p>
      </div>
    </a>
  </template>

  <div class="content">
    <div class="info-container">
      <img class="avatar" src="https://trudbot-md-img.oss-cn-shanghai.aliyuncs.com/202407082112768.jpg" alt="avatar"></img>
      <div class="name">@trudbot</div>
    </div>
    <div class="links-container"></div>
  </div>
  <div class="tip">
    阿里云备案太恶心人, 目前暂时跳到了github page, 访问速度很慢, 抱歉!
  </div>
  
  <div class="beian">
    <a href="https://beian.miit.gov.cn/" rel="noopener" target="_blank">蜀ICP备2023017814号-1 </a>
    <img src="https://trudbot-md-img.oss-cn-shanghai.aliyuncs.com/202407071401918.png" style="display: inline-block;" alt="gongan">
    <a href="http://www.beian.gov.cn/portal/registerSystemInfo?recordcode=51011402000613" rel="noopener" target="_blank">蜀公网安备 51011402000613 号 </a>
  </div>
  <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
  <span id="busuanzi_container_site_pv">
    PV: <span id="busuanzi_value_site_pv"></span>,&nbsp;
    UV: <span id="busuanzi_value_site_uv"></span>
  </span>

<script>
const links = [
  {
    href: 'https://github.com/trudbot',
    name: 'github',
    icon: 'https://trudbot-md-img.oss-cn-shanghai.aliyuncs.com/202407191658446.png'
  },
  {
    href: 'https://trudbot.github.io/Blog',
    name: 'blog',
    icon: 'https://trudbot-pic.oss-cn-hangzhou.aliyuncs.com/20240110214815285776-7322466096995979814-3.webp'
  },
  {
    href: 'https://www.zhihu.com/people/qu-ge-sha-ming-hao-ni-30',
    name: 'zhihu',
    icon: 'https://trudbot-md-img.oss-cn-shanghai.aliyuncs.com/202407191656864.png'
  },
  {
    href: 'https://www.npmjs.com/org/trudbot',
    name: 'npm',
    icon: 'https://trudbot-md-img.oss-cn-shanghai.aliyuncs.com/202407191651233.png'
  }
];

const linksContainer = document.querySelector('.links-container');
links.forEach(link => {
  const item = document.createElement('div');
  item.classList.add('link-item');

  const linkButton = document.createElement('link-button');
  linkButton.setAttribute('href', link.href);
  linkButton.setAttribute('icon', link.icon);

  const linkText = document.createElement('span');
  linkText.classList.add('link-text');
  linkText.textContent = link.name;
  linkText.slot = 'link-text';

  linkButton.appendChild(linkText);
  item.appendChild(linkButton);
  linksContainer.appendChild(item);
});
</script>
<script>
  window.onload = () => {
    setTimeout(() => {
      const pv = document.querySelector('#busuanzi_value_site_pv');
      const uv = document.querySelector('#busuanzi_value_site_uv');
      const container = document.querySelector('#busuanzi_container_site_pv');

      if (!pv.textContent || !uv.textContent) {
        container.style.display = 'none';
      }
    }, 1500);
  }
</script>
</body>
</html>
